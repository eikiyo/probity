name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      # pytest, NOT `unittest discover`. The RUNTIME has zero third-party dependencies; the
      # TEST SUITE needs pytest for fixtures (tmp_path, monkeypatch, parametrize). Under
      # `unittest discover` the pytest-style classes are not TestCase subclasses, so they are
      # silently NOT COLLECTED -- the command reported OK on 121 of 342 tests. A runner that
      # skips two thirds of the suite and exits 0 is worse than one that fails.
      - run: pip install pytest
      - run: pytest tests/ -q --tb=short

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with: { fetch-depth: 0 }
      - name: Install gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          chmod +x gitleaks
      - name: gitleaks
        run: ./gitleaks detect --source . --redact --exit-code 1
